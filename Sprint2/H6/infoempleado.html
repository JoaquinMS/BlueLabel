</head>
<body>

    <div class="container">
            <div class="col d-flex justify-content-start">
                <a class="navbar-brand" href="index.html">
                    <img src="img/logo-navbar.svg" alt="logo el buen sabor">
                </a>
            </div>
            <div class="col d-flex align-items-center justify-content-end">
              <div class="dropdown">

                  <a class="dropdown-item" href="changeInfo.html"><i class="fa-solid fa-file-lines"></i>   Mis datos</a>

  <div class="datos-empleado">
    <form>
        <h4 class="text-center mb-4 subrayado">Mis datos personales</h4>
        <div class="form-row mb-2">
            <div class="col-md-5">
                <label for="nombre-empleado">Nombre</label>
                <input type="text" class="form-control" id="nombre-empleado" placeholder="John" required>
              </div>
              <div class="col-md-5">
                <label for="apellido-empleado">Apellido</label>
                <input type="text" class="form-control" id="apellido-empleado" placeholder="Doe" required>
              </div>
            </div>
            <div class="form-row mb-2">
              <div class="col-md-5">
                <label for="direccion-empleado">Direccion</label>
                <input type="text" class="form-control" id="direccion-empleado" placeholder="Av. Siempreviva 787" required>
              </div>
              <div class="col-md-5">
                <label for="departamento">Departamento</label>
                <select id="departamento" class="form-control">
                  <option selected value="Capital">Capital</option>
                  <option value="Godoy Cruz">Godoy Cruz</option>
                  <option value="Guaymallén">Guaymallén</option>
                  <option value="Las Heras">Las Heras</option>
                  <option value="Lavalle">Lavalle</option>
                  <option value="Luján de Cuyo">Luján de Cuyo</option>
                  <option value="Maipú">Maipú</option>
                  <option value="Malargüe">Malargüe</option>
                  <option value="Rivadavia">Rivadavia</option>
                  <option value="San Carlos">San Carlos</option>
                  <option value="San Martín">San Martín</option>
                  <option value="San Rafael">San Rafael</option>
                  <option value="Santa Rosa">Santa Rosa</option>
                  <option value="Tunuyán">Tunuyán</option>
                  <option value="Tupungato">Tupungato</option>
                </select>
              </div>
            </div>
            <div class="form-row mb-2">
              <div class="col-md-5">
                <label for="tel-empleado">Telefono</label>
                <input type="text" class="form-control" id="tel-empleado" placeholder="2613789009" required>
              </div>
              <div class="col-md-5">
                <label for="email-empleado">Email</label>
                <input type="email" class="form-control" id="email-empleado" placeholder="nombre@ejemplo.com" required>
              </div>
            </div>
            <div class="form-row mb-2">
              <div class="col-md-5">
                <div class="contra-form">
                  <label for="contra-empleado">Contraseña</label>
                  <a href="#">Cambiar contraseña</a>
                </div>
                <input type="password" class="form-control" id="contra-empleado" placeholder="********" required>
              </div>
              <div class="col-md-5">
                <label for="bday-empleado">Fecha de nacimiento</label>
                <input type="password" class="form-control" id="bday-empleado" placeholder="01/01/2001" required>
              </div>
            </div>
            <div class="form-row">
              <div class="col-md-5 botones-form">
                <a href="#"><button type="button" class="btn btn-light">Volver</button></a>
              </div>
              <div class="col-md-5 botones-form">
                <button class="btn btn-guardar" type="submit">Guardar</button>
              </div>
            </div>
    </form>
  </div>

  <footer class="footer">
    <div class="footer-izquierda">
      <p>Contactanos</p>
      <p>Mendoza - Argentina</p>
      <p>26123988731</p>
    </div>

    <div class="footer-derecha">
        <a href="#"><i class="fa-brands fa-square-facebook fa-2x redes"></i></a>
        <a href="#"><i class="fa-brands fa-square-instagram fa-2x redes"></i></a>

    </div>
  </footer>
